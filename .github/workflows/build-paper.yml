name: Build paper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the full manuscript
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: TNSM_2026_10776_IDS_Model_Selection_Submission
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science cm-super poppler-utils
      - name: Compile the existing documents
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/TNSM_2026_10776_IDS_Model_Selection_Submission"
          BUILD=$(mktemp -d)
          cp -a "$PROJECT/." "$BUILD/"
          cd "$BUILD"
          for stem in main supplement Response_to_Reviewers Cover_Letter; do
            rm -f "$stem.aux" "$stem.fdb_latexmk" "$stem.fls" "$stem.log" "$stem.out"
            latexmk -g -pdf -interaction=nonstopmode -halt-on-error "$stem.tex" > "/tmp/$stem-build.txt" 2>&1 || { tail -100 "/tmp/$stem-build.txt"; exit 1; }
            if grep -E 'undefined references|Citation .* undefined|Reference .* undefined|Missing character:|Overfull' "$stem.log"; then
              exit 1
            fi
            echo "=== $stem ==="
            pdfinfo "$stem.pdf" | grep Pages
          done
          cp main.pdf "$PROJECT/pdf/Manuscript.pdf"
          cp supplement.pdf "$PROJECT/pdf/Supplement.pdf"
          cp Response_to_Reviewers.pdf "$PROJECT/pdf/Response_to_Reviewers.pdf"
          cp Cover_Letter.pdf "$PROJECT/pdf/Cover_Letter.pdf"
          cp main.bbl "$PROJECT/main.bbl"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])/'TNSM_2026_10776_IDS_Model_Selection_Submission'
          manifest = root/'MANIFEST_SHA256.txt'
          rows = [hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(root).as_posix()
                  for p in sorted(root.rglob('*')) if p.is_file() and p != manifest]
          manifest.write_text('\n'.join(rows)+'\n')
          PY
      - name: Update the existing PDF files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f TNSM_2026_10776_IDS_Model_Selection_Submission/pdf TNSM_2026_10776_IDS_Model_Selection_Submission/main.bbl TNSM_2026_10776_IDS_Model_Selection_Submission/MANIFEST_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Compile the full manuscript PDFs [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
