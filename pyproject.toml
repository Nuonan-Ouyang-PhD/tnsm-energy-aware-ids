[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tnsm-energy-aware-ids"
version = "0.1.0"
description = "Auditable experiment harness for an energy-aware IDS scheduler"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
tnsm-exp = "tnsm_exp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

